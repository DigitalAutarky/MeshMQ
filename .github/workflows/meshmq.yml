name: MeshMQ

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-preview.4.26230.115

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore
  
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-preview.4.26230.115

      - name: Restore dependencies
        run: dotnet restore

      - name: Test
        run: dotnet test --verbosity normal
  
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-preview.4.26230.115

      - name: Run Benchmarks
        working-directory: ./Benchmark
        run: |
          dotnet run -c Release -- --filter "*" --exporters github fulljson --join

      - name: Combine Benchmark Summaries
        if: github.event_name == 'pull_request'
        id: combine-md
        run: |
          COMBINED_FILE="./Benchmark/BenchmarkDotNet.Artifacts/results/combined_github.md"
          touch "$COMBINED_FILE"
          
          # Find all github.md files and append them to the combined file
          find ./Benchmark/BenchmarkDotNet.Artifacts/results -type f -name "*github.md" | while read file; do
            echo "Merging $file..."
            echo -e "### Benchmark: $(basename "$file")\n" >> "$COMBINED_FILE"
            cat "$file" >> "$COMBINED_FILE"
            echo -e "\n---\n" >> "$COMBINED_FILE"
          done
          
          if [ ! -s "$COMBINED_FILE" ]; then
            echo "Error: No github benchmark reports found!"
            ls -R ./Benchmark/BenchmarkDotNet.Artifacts || echo "Artifacts directory missing."
            exit 1
          fi
          
          echo "md_file=$COMBINED_FILE" >> $GITHUB_OUTPUT
          echo "Successfully combined files."

      - name: Post Combined Benchmark Summary
        if: github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v3
        with:
          file-path: ${{ steps.combine-md.outputs.md_file }}
          comment-tag: benchmark-summary
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Compare Benchmarks On Pull Request
        if: github.event_name == 'pull_request'
        uses: martincostello/benchmarkdotnet-results-publisher@v2
        with:
          action: 'comment'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          search-pattern: 'Benchmark/BenchmarkDotNet.Artifacts/results/*-report-full.json'
          branch: 'gh-pages'
          duration-threshold: '100%'
          memory-threshold: '100%'
          fail-on-alert: true
          
      - name: Publish Benchmarks to History
        if: github.event_name == 'push'
        uses: martincostello/benchmarkdotnet-results-publisher@v2
        with:
          action: 'publish'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          search-pattern: 'Benchmark/BenchmarkDotNet.Artifacts/results/*-report-full.json'
          branch: 'gh-pages'