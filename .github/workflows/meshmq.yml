name: MeshMQ

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    
permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 11.0.100-preview.4.26230.115
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
      
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-preview.4.26230.115
      - name: Restore dependencies
        run: dotnet restore
      - name: Test
        run: dotnet test --verbosity normal
  
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-preview.4.26230.115
      - name: Run Benchmarks
        run: |
          dotnet run --project ./Benchmark/Benchmark.csproj -c Release --exporters json      
      - name: Find Benchmark JSON
        id: locate-json
        run: |
          JSON_FILE=$(find ./Benchmark/BenchmarkDotNet.Artifacts/results -name "*.json" ! -name "*-report*" | head -n 1)
          echo "json_file=$JSON_FILE" >> $GITHUB_OUTPUT
          echo "Found JSON: $JSON_FILE"
      - name: Store Benchmark Result & Detect Regression
        uses: rhysd/github-action-benchmark@v1
        with:
          tool: 'benchmarkdotnet'
          output-file-path: ${{ steps.locate-json.outputs.json_file }}
          alert-threshold: '120%'
          comment-on-alert: true
          fail-on-alert: true
          gh-pages-branch: 'gh-pages'
          github-token: ${{ secrets.GITHUB_TOKEN }}    
    