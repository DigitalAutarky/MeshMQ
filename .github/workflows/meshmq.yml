name: MeshMQ

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-preview.4.26230.115

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore
  
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-preview.4.26230.115

      - name: Restore dependencies
        run: dotnet restore

      - name: Test
        run: dotnet test --verbosity normal
  
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-preview.4.26230.115

      - name: Run Benchmarks
        working-directory: ./Benchmark
        run: |
          dotnet run -c Release -- --filter "*" --exporters fulljson

      - name: Find Benchmark JSON
        id: locate-json
        run: |
          JSON_FILE=$(find ./Benchmark/BenchmarkDotNet.Artifacts/results -name "*.json" | head -n 1)
          if [ -z "$JSON_FILE" ]; then
            echo "Error: No JSON benchmark report found!"
            echo "Here is the contents of the Artifacts directory for debugging:"
            ls -R ./Benchmark/BenchmarkDotNet.Artifacts || echo "Artifacts directory missing."
            exit 1
          fi
          echo "json_file=$JSON_FILE" >> $GITHUB_OUTPUT
          echo "Found JSON: $JSON_FILE"
          
      # 1. Guarantee the directory exists so the benchmark action can safely write to it
      - name: Create baseline directory
        run: mkdir -p ./baseline
          
      # 2. Get the Run ID of the latest successful 'main' workflow
      - name: Get Latest Main Run ID
        id: get-run-id
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Uses the native GitHub CLI to find the ID of the last successful run on main
          LATEST_RUN_ID=$(gh run list --branch main --workflow "${{ github.workflow }}" --status success --limit 1 --json databaseId -q '.[0].databaseId')
          
          if [ -z "$LATEST_RUN_ID" ] || [ "$LATEST_RUN_ID" == "null" ]; then
          echo "No successful runs found on main yet. This is normal for the first run."
          else
          echo "run_id=$LATEST_RUN_ID" >> $GITHUB_OUTPUT
          echo "Found successful run on main: $LATEST_RUN_ID"
          fi
          
      # 3. Download the official v4 Baseline Artifact
      - name: Download Baseline Artifact
       if: steps.get-run-id.outputs.run_id != ''
       uses: actions/download-artifact@v4
       continue-on-error: true # Still essential in case the artifact expired (past 30 days)
       with:
         name: benchmark-baseline
         path: ./baseline
         github-token: ${{ secrets.GITHUB_TOKEN }}
         run-id: ${{ steps.get-run-id.outputs.run_id }}
      
      # 3. Compare PR against Baseline & Generate standardized JSON
      - name: Compare Benchmarks
        uses: rhysd/github-action-benchmark@v1
        with:
          name: 'MeshMQ Core Benchmarks'
          tool: 'benchmarkdotnet'
          output-file-path: ${{ steps.locate-json.outputs.json_file }}
          external-data-json-path: ./baseline/benchmark-data.json
      
          alert-threshold: '120%'
          fail-on-alert: true
          summary-always: true
          comment-on-alert: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
      
          save-data-file: true
      
      # 4. Upload New Baseline (ONLY if this workflow is running on a push to main)
      - name: Upload New Baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-baseline
          path: ./baseline/benchmark-data.json # <--- Fixed: Now points to the correct folder
          retention-days: 30